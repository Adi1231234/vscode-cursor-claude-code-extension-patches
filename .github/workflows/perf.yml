# Every pull request into master, on every push to it: do the patches still
# leave the panel as fast as it should be? master requires this check ("perf")
# to pass before a pull request can merge, admins included - set in the
# branch's protection, not here.
#
# 1. The static rules, in a second: no timers, one DOM observer, no class
#    matched by substring (tools/check-webview-runtime.mjs).
# 2. The real panel measured: the published extension and the same extension
#    after apply.ps1, side by side in a headless Chrome, opening a long
#    conversation, idling, scrolling and streaming a working turn
#    (tools/perf/README.md). Fails when the patched panel goes over
#    tools/perf/budgets.json.
#
# Windows, because apply.ps1 is Windows PowerShell; the runner image has
# Chrome and Node (its own LTS - actions/setup-node found the same kind of
# Node already there and spent 6 s printing versions). The extension, unpacked
# and without the CLI binary (~11 MB), is cached per pull request, so only a
# request's first run downloads the VSIX (~120 MB). A whole run is under 2
# minutes; tools/perf/README.md ("Keeping a run short") has what keeps it so.
name: Panel performance

on:
  pull_request:
    branches: [master]

# A newer push to the same request replaces the run of the older one.
concurrency:
  group: perf-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  perf:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Static rules (no timers, one observer, exact classes)
        run: node tools/check-webview-runtime.mjs

      - name: File writes (a brief lock waited out, each bundle written once)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File lib/tests/run.ps1

      - name: Cache the unpacked extension
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/cc-perf-cache
          key: cc-perf-ext-${{ hashFiles('tools/perf/budgets.json') }}
          restore-keys: cc-perf-ext-

      - name: Measure the patched panel against the published one
        env:
          CC_PERF_CACHE: ${{ runner.temp }}/cc-perf-cache
        run: node tools/perf/perf.mjs --json perf.json

      - name: Keep every number
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf
          path: perf.json
          if-no-files-found: ignore
